      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - grep -q ':1D32 ' /proc/net/tcp || grep -q ':1D32 ' /proc/net/tcp6 || exit 1
      timeout: 3s
      interval: 15s
      retries: 6
      start_period: 20s
    image: neo4j:5.22.0
    networks:
      backend: null
      database: null
    ports:
      - mode: ingress
        target: 7474
        published: "8474"
        protocol: tcp
      - mode: ingress
        target: 7687
        published: "8687"
        protocol: tcp
