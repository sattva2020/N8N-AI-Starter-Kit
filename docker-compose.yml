# Simple, validated docker-compose for local development.
# Uses Prometheus + Blackbox exporter for service probing (service-health removed).

x-traefik-base: &traefik-base
  image: traefik:latest
  restart: unless-stopped
  ports:
    - "0.0.0.0:80:80"
    - "0.0.0.0:443:443"
    - "127.0.0.1:8080:8080"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - traefik_letsencrypt:/letsencrypt
    - ./config/traefik:/etc/traefik/dynamic
  networks:
  - frontend
  - backend

x-service-n8n: &service-n8n
  image: n8nio/n8n:latest
  restart: unless-stopped
  environment:
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_HOST=${N8N_HOST}
    - N8N_PORT=${N8N_PORT}
    - N8N_PROTOCOL=${N8N_PROTOCOL}
    - DB_TYPE=${DB_TYPE}
    - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
    - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
    - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
    - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
  networks:
    - frontend
    - backend
  volumes:
    - ./n8n/credentials:/home/node/.n8n/credentials:ro
  healthcheck:
    # Use loopback for container-local health probe and a node-based check so
    # the probe does not depend on curl being present in the image.
    # test is provided as an array: [CMD-SHELL, <command string>]
    test:
      - "CMD-SHELL"
      - "node -e \"const http=require('http');const p=process.env.N8N_PORT||5678;const path=process.env.N8N_HEALTH_PATH||'/';const req=http.request({method:'GET',host:'127.0.0.1',port:p,path:path},res=>{process.exit([200,301,302].includes(res.statusCode)?0:1)});req.on('error',()=>process.exit(1));req.end();\""
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  traefik:
    <<: *traefik-base
    profiles: [default, cpu, gpu-nvidia, developer]
    command:
      - "--api.dashboard=true"
      - "--entryPoints.traefik.address=:8080"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--log.filePath=/var/log/traefik.log"
      - "--log.format=json"
      - "--ping=true"
      - "--log.level=INFO"
      - "--accesslog=true"

  n8n:
    <<: *service-n8n
    profiles: [default, cpu, gpu-nvidia, developer]
    ports:
      - "5678:5678"
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-http.rule=Host(`n8n.${DOMAIN_NAME}`)"
      - "traefik.http.routers.n8n-http.entrypoints=web"
      - "traefik.http.routers.n8n-http.middlewares=https-redirect@file"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN_NAME}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.routers.n8n.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
  # healthcheck removed: switching to Prometheus + Blackbox exporter for probing

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    profiles: [default, cpu, gpu-nvidia, developer]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
      - N8N_USER=n8n
      - N8N_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./scripts/init-n8n-user.sh:/docker-entrypoint-initdb.d/02-init-n8n-user.sh:ro
    networks:
      - database
      - backend
  # healthcheck removed: switching to Prometheus + Blackbox exporter for probing

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: [developer]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      - "traefik.http.routers.pgadmin.middlewares=security-headers@file,https-redirect@file"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
  # removed; Prometheus/Blackbox will perform HTTP probe checks

  jupyterlab:
    image: jupyter/minimal-notebook:latest
    restart: unless-stopped
    profiles: [developer]
    volumes:
      - jupyter_data:/home/jovyan/work
    networks:
      - frontend
      - backend
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`${JUPYTER_DOMAIN}`)"
      - "traefik.http.routers.jupyter.entrypoints=websecure"
      - "traefik.http.routers.jupyter.tls=true"
      - "traefik.http.routers.jupyter.tls.certresolver=myresolver"
      - "traefik.http.routers.jupyter.middlewares=security-headers@file,admin-auth@file"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"
  # removed; Prometheus/Blackbox will perform HTTP probe checks

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - backend
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`${QDRANT_DOMAIN}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls=true"
      - "traefik.http.routers.qdrant.tls.certresolver=myresolver"
      - "traefik.http.routers.qdrant.middlewares=security-headers@file,admin-auth@file"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

  # monitoring services removed from root compose to avoid duplication.
  # Use the existing monitoring compose files under `compose/` (prometheus, grafana, alertmanager, exporters).

include:
  - path: ./compose/graphiti-compose.yaml
  - path: ./compose/ollama-compose.yml
  - path: ./compose/optional-services.yml

volumes:
  n8n_storage:
  postgres_storage:
  ollama_data:
  traefik_letsencrypt:
  pgadmin_data:
  qdrant_storage:
  qdrant_snapshots:
  jupyter_data:
  n8n_import_logs:

configs:
  qdrant_config:
    content: |
      log_level: INFO

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge
