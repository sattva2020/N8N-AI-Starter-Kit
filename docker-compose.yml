x-traefik-base: &traefik-base
  image: traefik:latest
  restart: unless-stopped
  ports:
    - "0.0.0.0:80:80"
    - "0.0.0.0:443:443"
    - "127.0.0.1:8080:8080"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - traefik_letsencrypt:/letsencrypt
    - ./config/traefik:/etc/traefik/dynamic
  networks:
    - frontend
  healthcheck:
    test: ["CMD", "traefik", "healthcheck", "--ping"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

x-service-n8n: &service-n8n
  image: n8nio/n8n:latest
  restart: unless-stopped
  environment:
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_HOST=${N8N_HOST}
    - N8N_PORT=${N8N_PORT}
    - N8N_PROTOCOL=${N8N_PROTOCOL}
    # Database configuration
    - DB_TYPE=${DB_TYPE}
    - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
    - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
    - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
    - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
    - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
    # Fix permissions warning
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    # Ensure fresh start with clean config - CRITICAL for encryption key conflicts
   # - N8N_RESET=true
   # - N8N_RESET_OWNER_ONLY=true
  networks:
    - frontend
    - backend
  volumes:
    - n8n_storage:/home/node/.n8n
    - ./n8n/credentials:/home/node/.n8n/credentials:ro  # Локальные credentials

services:
  traefik:
    <<: *traefik-base
    profiles: [default, cpu, gpu-nvidia, developer]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command:
      - "--api.dashboard=true"
      - "--entryPoints.traefik.address=:8080"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.caserver=https://acme-v02.api.letsencrypt.org/directory"
      - "--log.filePath=/var/log/traefik.log"
      - "--log.format=json"
      - "--ping=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=traefik"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_USERNAME}:${TRAEFIK_PASSWORD_HASHED}"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"

  # Общие настройки для N8N
  n8n:
    <<: *service-n8n
    profiles: [default, cpu, gpu-nvidia, developer]
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # HTTPS роутинг для продакшн доменов
      - "traefik.http.routers.n8n-secure.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n-secure.entrypoints=websecure"
      - "traefik.http.routers.n8n-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.n8n-secure.service=n8n"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s  # Увеличиваем время запуска

  # N8N Workflows Auto-Importer v1.2.0
  n8n-workflows-importer:
    build:
      context: .
      dockerfile: services/n8n-importer/Dockerfile
      args:
        ALPINE_VERSION: 3.22
    profiles: [default, cpu, gpu-nvidia, developer]
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./n8n/workflows:/workflows:ro  # Workflows из репозитория Zie619/n8n-workflows
      - ./n8n/credentials:/credentials:ro  # Credentials для N8N
      - n8n_import_logs:/app/logs  # Логи импорта
    networks:
      - frontend
    environment:
      - N8N_URL=http://n8n:5678
      - PYTHONUNBUFFERED=1
    restart: "no"  # Запускается один раз при развертывании
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  postgres:
    image: pgvector/pgvector:pg17 # Образ с поддержкой pgvector для Graphiti (последняя версия)
    restart: unless-stopped
    profiles: [default, cpu, gpu-nvidia, developer]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
      # Передаем переменные для скрипта инициализации (правильные значения)
      - N8N_USER=n8n
      - N8N_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      # - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro  # Временно отключен
      - ./scripts/init-n8n-user.sh:/docker-entrypoint-initdb.d/02-init-n8n-user.sh:ro
      # Zep скрипт больше не нужен после перехода на Graphiti
    networks:
      - database
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB} || pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest # latest для упрощения поддержки
    restart: unless-stopped
    profiles: [developer]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      # Disable TLS for localhost development
      # Uncomment for production:
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/pgadmin4/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest # latest для упрощения поддержкиcat 
    restart: unless-stopped
    profiles: [default, cpu, gpu-nvidia, developer]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - backend
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`${QDRANT_DOMAIN}`)"
      - "traefik.http.routers.qdrant.entrypoints=web"
      # Disable TLS for localhost development
      # Uncomment for production:
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls.certresolver=myresolver"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5  # Увеличиваем количество попыток
      start_period: 60s  # Увеличиваем время запуска

  document-processor:
    build: ./services/document-processor
    restart: unless-stopped
    profiles: [default, cpu, gpu-nvidia, developer]
    ports:
      - "8001:8001"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/processed:/app/processed
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - MAX_FILE_SIZE=100MB
      - SUPPORTED_FORMATS=pdf,docx,txt,md,rtf
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    networks:
      - backend
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docprocessor.rule=Host(`${DOCUMENT_PROCESSOR_DOMAIN}`)"
      - "traefik.http.routers.docprocessor.entrypoints=web"
      - "traefik.http.services.docprocessor.loadbalancer.server.port=8001"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-interface:
    build: ./services/web-interface
    restart: unless-stopped
    profiles: [default, cpu, gpu-nvidia, developer]
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DOCUMENT_PROCESSOR_URL=http://document-processor:8001
      - QDRANT_URL=http://qdrant:6333
    networks:
      - backend
      - frontend
    depends_on:
      document-processor:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webinterface.rule=Host(`${WEB_INTERFACE_DOMAIN}`)"
      - "traefik.http.routers.webinterface.entrypoints=web"
      - "traefik.http.services.webinterface.loadbalancer.server.port=8002"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ollama:
  #   <<: *service-ollama
  #   profiles: [default, cpu]
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.ollama.rule=Host(`${OLLAMA_DOMAIN}`)"
  #     - "traefik.http.routers.ollama.entrypoints=websecure"
  #     - "traefik.http.routers.ollama.tls.certresolver=myresolver"
  #     - "traefik.http.services.ollama.loadbalancer.server.port=11434"
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '4'
  #         memory: 8G
  #       reservations:
  #         cpus: '2'
  #         memory: 4G

  jupyterlab:
    image: jupyter/minimal-notebook:latest # latest для упрощения поддержки
    restart: unless-stopped
    profiles: [developer]
    volumes:
      - jupyter_data:/home/jovyan/work
    networks:
      - frontend
      - backend
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`${JUPYTER_DOMAIN}`)"
      - "traefik.http.routers.jupyter.entrypoints=web"
      # Disable TLS for localhost development
      # Uncomment for production:
      - "traefik.http.routers.jupyter.entrypoints=websecure"
      - "traefik.http.routers.jupyter.tls.certresolver=myresolver"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

include:
  # Graphiti и Neo4j для AI память и граф знаний
  - path: ./compose/graphiti-compose.yaml  # Содержит Graphiti и Neo4j (бывший zep-compose.yaml)
  # - path: ./compose/supabase-compose.yml  # Временно отключен для упрощения диагностики
  - path: ./compose/ollama-compose.yml
  - path: ./compose/optional-services.yml

volumes:
  n8n_storage:
  postgres_storage:
  ollama_data:
  traefik_letsencrypt:
    external: true
  pgadmin_data:
  qdrant_storage:
  jupyter_data:
  n8n_import_logs:  # Логи автоматического импорта workflows

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge
