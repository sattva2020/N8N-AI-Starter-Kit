name: Tests
true:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install test deps
      run: 'python -m pip install --upgrade pip

        pip install pytest

        '
    - name: Run tests
      run: 'mkdir -p tests/test-results

        pytest -q --junitxml=tests/test-results/junit.xml || true

        '
    - name: Write summary
      run: 'python tests/scripts/write_summary.py tests/test-results/junit.xml tests/test-results/summary.md
        || true

        '
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/test-results/
