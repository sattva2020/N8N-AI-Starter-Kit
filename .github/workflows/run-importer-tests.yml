name: Run importer tests

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  run-tests:
    name: Run importer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make test script executable
        run: |
          chmod +x ./tests/test_run_importer.sh

      - name: Run importer tests
        run: |
          ./tests/test_run_importer.sh
        shell: bash
