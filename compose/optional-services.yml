services:
  lightrag:
    container_name: lightrag
    image: ghcr.io/hkuds/lightrag:latest
    restart: unless-stopped
    profiles:
    - developer
    - cpu
    - gpu
    - reasoning
    ports:
    - ${PORT:-9621}:9621
    depends_on:
    - qdrant
    environment:
    - PORT=${PORT:-9621}
    - LIGHRAG_WORKDIR=/data/lightrag
    - LIGHRAG_ENV=production
    - LIGHRAG_DOMAIN=${LIGHRAG_DOMAIN}
    - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
    - TOKEN_SECRET=${TOKEN_SECRET}
    - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    - ALLOW_ANONYMOUS_ACCESS=${ALLOW_ANONYMOUS_ACCESS:-false}
    volumes:
    - ../lightrag_data:/data/lightrag:rw
    networks:
    - backend
    - frontend
    labels:
    - traefik.enable=true
    - traefik.http.routers.lightrag-http.rule=Host(`${LIGHRAG_DOMAIN}`)
    - traefik.http.routers.lightrag-http.entrypoints=web
    - traefik.http.routers.lightrag-http.middlewares=https-redirect@file
    - traefik.http.routers.lightrag.rule=Host(`${LIGHRAG_DOMAIN}`)
    - traefik.http.routers.lightrag.entrypoints=websecure
    - traefik.http.routers.lightrag.tls=true
    - traefik.http.routers.lightrag.tls.certresolver=myresolver
    - traefik.http.routers.lightrag.middlewares=security-headers@file,admin-auth@file,rate-limit@file
    - traefik.http.services.lightrag.loadbalancer.server.port=9621
  n8n-importer:
    build: ../services/n8n-importer
    image: n8n-importer:local
    restart: 'no'
    profiles:
    - developer
    environment:
    - ALLOW_RUNTIME_CLONE=false
    - N8N_AUTO_IMPORT=false
    volumes:
    - ../services/n8n-importer/n8n-workflows:/opt/n8n-workflows:ro
    - ../logs/n8n-importer:/var/log/n8n-importer:rw
    networks:
    - backend
