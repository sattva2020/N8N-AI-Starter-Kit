services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles:
    - default
    - cpu
    - gpu
    - developer
    ports:
    - 11434:11434
    volumes:
    - ollama_data:/root/.ollama
    - ../config:/config:ro
    environment:
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_MODELS=/root/.ollama/models
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
    - frontend
    - backend
    labels:
    - traefik.enable=true
    - traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN_NAME}`)
    - traefik.http.routers.ollama.entrypoints=websecure
    - traefik.http.services.ollama.loadbalancer.server.port=11434
  ollama-pull:
    image: alpine:3.18
    profiles:
    - default
    - cpu
    - gpu
    - developer
    restart: 'no'
    networks:
    - backend
    volumes:
    - ../config:/config:ro
    - ../logs/ollama:/var/log/ollama:rw
    depends_on:
    - ollama
    command: "sh -c '\n  apk add --no-cache curl jq >/dev/null 2>&1 || true\n\n  #\
      \ Robust logging: prefer /var/log/ollama if it is a writable directory, otherwise\
      \ use /tmp\n  LOG_TMP=/tmp/ollama-pull-$$.log\n  if [ -d /var/log/ollama ] 2>/dev/null;\
      \ then\n    LOG_PATH=/var/log/ollama/ollama-pull.log\n    touch \"$$LOG_PATH\"\
      \ 2>/dev/null || true\n    if [ -w \"$$LOG_PATH\" ] || [ -w /var/log/ollama\
      \ ]; then\n      exec > >(tee -a \"$$LOG_PATH\") 2>&1\n    else\n      exec\
      \ >\"$$LOG_TMP\" 2>&1\n    fi\n  else\n    mkdir -p /var/log/ollama 2>/dev/null\
      \ || true\n    if [ -d /var/log/ollama ] 2>/dev/null; then\n      LOG_PATH=/var/log/ollama/ollama-pull.log\n\
      \      touch \"$$LOG_PATH\" 2>/dev/null || true\n      if [ -w \"$$LOG_PATH\"\
      \ ] || [ -w /var/log/ollama ]; then\n        exec > >(tee -a \"$$LOG_PATH\"\
      ) 2>&1\n      else\n        exec >\"$$LOG_TMP\" 2>&1\n      fi\n    else\n \
      \     exec >\"$$LOG_TMP\" 2>&1\n    fi\n  fi\n\n  echo \"Ожидание готовности\
      \ службы (таймаут 5m)...\"\n  # Ждем пока сервис ответит на /api/ps (проверяем\
      \ каждые 5 секунд, максимум 60 попыток = 5 минут)\n  ready=0\n  i=1\n  while\
      \ [ \"$$i\" -le 60 ]; do\n    if curl -sS \"${LLM_BINDING_HOST:-http://ollama:11434}/api/ps\"\
      \ >/dev/null 2>&1; then\n      ready=1\n      break\n    fi\n    echo \"  Сервис\
      \ не готов, повторная проверка через 5s... ($$i/60)\"\n    sleep 5\n    i=$(expr\
      \ $$i + 1)\n  done\n  if [ \"$$ready\" -ne 1 ]; then\n    echo \"Сервис не стал\
      \ готов в течение таймаута. Пропускаю загрузку моделей.\" >&2\n    exit 1\n\
      \  fi\n\n  echo \"Чтение моделей из /config/ollama-models.txt...\"\n  if [ !\
      \ -f /config/ollama-models.txt ]; then\n    echo \"Файл /config/ollama-models.txt\
      \ не найден. Пропускаем загрузку моделей.\"\n    exit 0\n  fi\n\n  # Читаем\
      \ файл и загружаем каждую модель\n  while IFS= read -r model_name || [ -n \"\
      $$model_name\" ]; do\n    # Пропускаем пустые строки и комментарии\n    if [\
      \ -z \"$$model_name\" ] || [ \"$(echo \"$$model_name\" | cut -c1)\" = \"#\"\
      \ ]; then\n      continue\n    fi\n\n    echo \"Загрузка модели: $$model_name\"\
      \n    # отправляем запрос на скачивание модели\n    if curl -sS -X POST \"${LLM_BINDING_HOST:-http://ollama:11434}/api/pull\"\
      \ -H \"Content-Type: application/json\" -d \"{\\\"name\\\":\\\"$$model_name\\\
      \"}\" --max-time 3600; then\n      echo \"  POST /api/pull отправлен для $$model_name\"\
      \n    else\n      echo \"  Ошибка при отправке /api/pull для $$model_name\"\
      \ >&2\n      continue\n    fi\n\n    # После успешного POST ждём появления модели\
      \ в /v1/models (timeout 30m)\n    wait_ok=0\n    checks=0\n    max_checks=360\
      \  # 360 * 5s = 1800s = 30 минут\n    while [ \"$$checks\" -lt $$max_checks\
      \ ]; do\n      # Prefer precise JSON parsing with jq, fallback to grep if jq\
      \ missing\n      if command -v jq >/dev/null 2>&1; then\n        if curl -sS\
      \ \"${LLM_BINDING_HOST:-http://ollama:11434}/v1/models\" | jq -r '.data[].id'\
      \ | grep -F \"$$model_name\" >/dev/null 2>&1; then\n          echo \"  Модель\
      \ $$model_name зарегистрирована\"\n          wait_ok=1\n          break\n  \
      \      fi\n      else\n        if curl -sS \"${LLM_BINDING_HOST:-http://ollama:11434}/v1/models\"\
      \ | grep -F \"$$model_name\" >/dev/null 2>&1; then\n          echo \"  Модель\
      \ $$model_name зарегистрирована\"\n          wait_ok=1\n          break\n  \
      \      fi\n      fi\n\n      echo \"  Модель $$model_name ещё не зарегистрирована,\
      \ проверка через 5s... ($$checks/$$max_checks)\"\n      sleep 5\n      checks=$$(expr\
      \ $$checks + 1)\n    done\n    if [ \"$$wait_ok\" -ne 1 ]; then\n      echo\
      \ \"  Таймаут ожидания регистрации модели $$model_name\" >&2\n    fi\n    echo\
      \ \"\"\n  done < /config/ollama-models.txt\n\n  echo \"Инициализация моделей\
      \ завершена.\"\n'\n"
    labels:
    - traefik.enable=false
volumes:
  ollama_data: null
