
services:
  # Основной сервис Ollama с оптимизированной конфигурацией
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles: [default, cpu, gpu-nvidia]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./config/ollama-models.txt:/config/ollama-models.txt:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
    healthcheck:
      test: ["CMD", "/bin/ollama", "ps"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`${OLLAMA_DOMAIN}`)"
      - "traefik.http.routers.ollama.entrypoints=web"
      # Disable TLS for localhost development
      # Uncomment for production:
      # - "traefik.http.routers.ollama.entrypoints=websecure"
      # - "traefik.http.routers.ollama.tls.certresolver=myresolver"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"

  # Сервис для предварительной загрузки моделей Ollama
  ollama-pull:
    image: curlimages/curl:latest # Используем более подходящий образ
    profiles: [default, cpu, gpu-nvidia]
    restart: "no"
    networks:
      - backend
    volumes:
      - ./config/ollama-models.txt:/app/models.txt:ro # Монтируем файл с моделями
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c '
        echo "Ожидание готовности Ollama (15s)..."
        sleep 15
        
        echo "Чтение моделей из /app/models.txt..."
        if [ ! -f /app/models.txt ]; then
          echo "Файл /app/models.txt не найден. Пропускаем загрузку моделей."
          exit 0
        fi

        # Читаем файл и загружаем каждую модель
        while IFS= read -r model_name || [ -n "$model_name" ]; do
          # Пропускаем пустые строки и комментарии
          if [ -z "$model_name" ] || [ "$(echo "$model_name" | cut -c1)" = "#" ]; then
            continue
          fi
          
          echo "Загрузка модели: $model_name"
          curl -X POST http://ollama:11434/api/pull -d "{\"name\":\"$model_name\"}" --max-time 3600 || echo "Ошибка при загрузке модели $model_name"
          echo ""
        done < /app/models.txt
        
        echo "Инициализация моделей завершена."
      '
    labels:
      - "traefik.enable=false"

# Networks определены в главном docker-compose.yml
# volumes are defined here
volumes:
  ollama_data: