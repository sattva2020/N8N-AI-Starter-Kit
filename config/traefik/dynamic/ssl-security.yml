tls:
  options:
    default:
      minVersion: "TLSv1.2"
      maxVersion: "TLSv1.3"

http:
  middlewares:
    security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline';
          img-src 'self' data: https: blob:; connect-src 'self' wss: ws: https:; font-src 'self' data:; object-src 'none';
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    api-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - OPTIONS

# Notes: keep this file minimal and valid; mount secrets for htpasswd via file/secret in production
