# Traefik dynamic configuration: middlewares used by docker labels
# Do NOT store real passwords here in the repo. Replace placeholders or
# configure via secrets/variables in production.

http:
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        strictTransportSecurity:
          maxAge: 63072000
          includeSubDomains: true
        referrerPolicy: "no-referrer"

    admin-auth:
      basicAuth:
        # Use htpasswd lines (generated offline). Replace below with actual file/secret.
        users:
          - "admin:$apr1$PLACEHOLDER$REPLACED"

    rate-limit:
      rateLimit:
        average: 10
        burst: 20
