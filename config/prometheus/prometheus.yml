global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: n8n-ai-starter-kit
    environment: ${ENVIRONMENT:-development}
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- alert.rules
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
  scrape_interval: 15s
  metrics_path: /metrics
- job_name: node-exporter
  static_configs:
  - targets:
    - node-exporter:9100
  scrape_interval: 15s
  metrics_path: /metrics
- job_name: cadvisor
  static_configs:
  - targets:
    - cadvisor:8080
  scrape_interval: 15s
  metrics_path: /metrics
- job_name: n8n
  static_configs:
  - targets:
    - n8n:5678
  scrape_interval: 30s
  metrics_path: /metrics
  scrape_timeout: 10s
- job_name: n8n-exporter
  static_configs:
  - targets:
    - n8n-exporter:9101
  scrape_interval: 30s
  metrics_path: /metrics
- job_name: postgres
  static_configs:
  - targets:
    - postgres:5432
  scrape_interval: 30s
  metrics_path: /metrics
- job_name: qdrant
  static_configs:
  - targets:
    - qdrant:6333
  scrape_interval: 30s
  metrics_path: /metrics
  scrape_timeout: 10s
- job_name: traefik
  static_configs:
  - targets:
    - traefik:8080
  scrape_interval: 15s
  metrics_path: /metrics
- job_name: ollama
  static_configs:
  - targets:
    - ${OLLAMA_METRICS_TARGET:-ollama:11434}
  scrape_interval: 30s
  metrics_path: /metrics
  scrape_timeout: 10s
- job_name: graphiti
  static_configs:
  - targets:
    - graphiti:8000
  scrape_interval: 30s
  metrics_path: /metrics
  scrape_timeout: 10s
- job_name: document-processor
  static_configs:
  - targets:
    - document-processor:8001
  scrape_interval: 30s
  metrics_path: /metrics
- job_name: web-interface
  static_configs:
  - targets:
    - web-interface:8002
  scrape_interval: 30s
  metrics_path: /metrics
- job_name: workflows-importer
  static_configs:
  - targets:
    - workflows-importer:8003
  scrape_interval: 60s
  metrics_path: /metrics
- job_name: docker-containers
  docker_sd_configs:
  - host: unix:///var/run/docker.sock
    refresh_interval: 5s
    filters:
    - name: label
      values:
      - prometheus.scrape=true
  relabel_configs:
  - source_labels:
    - __meta_docker_container_label_prometheus_job
    target_label: job
  - source_labels:
    - __meta_docker_container_label_prometheus_port
    target_label: __address__
    regex: (.+)
    replacement: ${__meta_docker_container_network_ip}:${1}
- job_name: blackbox
  metrics_path: /probe
  params:
    module:
    - http_2xx
  static_configs:
  - targets:
    - http://traefik:80/
    - http://pgadmin:80/
    - http://jupyterlab:8888/
    - http://n8n:5678/
    - http://qdrant:6333/
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: blackbox:9115
- job_name: blackbox-tcp
  metrics_path: /probe
  params:
    module:
    - tcp_connect
  static_configs:
  - targets:
    - neo4j-graphiti:7474
    - graphiti:8000
    - ${OLLAMA_METRICS_TARGET:-ollama:11434}
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: blackbox:9115
- job_name: blackbox-http
  metrics_path: /probe
  params:
    module:
    - http_2xx
  static_configs:
  - targets:
    - http://neo4j-graphiti:7474/
    - http://graphiti:8000/
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: blackbox:9115
