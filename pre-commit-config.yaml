repos:
  # Проверка, что документация обновлена при изменениях
  - repo: local
    hooks:
      - id: check-docs-updated
        name: Проверка обновления документации
        entry: |
          sh -c '
            if git diff --cached --name-only | grep -E "^(docker-compose|compose/|scripts/|env.schema)" \
               && ! git diff --cached --name-only | grep -E "^(README.md|docs/|.env)"; then
              echo "❌ Изменения в инфраструктуре, но документация не обновлена!"
              echo "Пожалуйста, обнови: README.md, docs/ARCHITECTURE.md, docs/SETUP_GUIDE.md или env.schema"
              exit 1
            fi
            echo "✅ Документация проверена"
          '
        language: system
        pass_filenames: false
        stages: [commit]

  # Проверка формата Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        types: [markdown]
        args: [--prose-wrap=always]

  # Проверка .env и env.schema на согласованность (legacy env.schema.md поддерживается)
  - repo: local
    hooks:
      - id: check-env-sync
        name: Сравнение env.schema и .env (legacy env.schema.md supported)
        entry: |
          bash -c '
            schema_file=env.schema
            if [ ! -f "$schema_file" ] && [ -f env.schema.md ]; then schema_file=env.schema.md; fi
            if [ -f .env ] && [ -f "$schema_file" ]; then
              echo "Сравниваю $schema_file и .env..."
              comm -23 <(grep -E "^[A-Za-z0-9_]+=.*" "$schema_file" | sed -E "s/=.*$//" | sort -u) <(grep -E "^[A-Za-z0-9_]+=.*" .env | sed -E "s/=.*$//" | sort -u) | grep -q . && {
                echo "⚠️  Переменные в $schema_file отсутствуют в .env:"
                comm -23 <(grep -E "^[A-Za-z0-9_]+=.*" "$schema_file" | sed -E "s/=.*$//" | sort -u) <(grep -E "^[A-Za-z0-9_]+=.*" .env | sed -E "s/=.*$//" | sort -u)
                echo "Рекомендуется обновить .env через setup.sh"
              } || echo "✅ .env и $schema_file синхронизированы"
            fi
          '
        language: system
        pass_filenames: false
        stages: [commit]
      - id: check-env-placeholders
        name: Проверка на плейсхолдеры/пустые значения в env файлов
        entry: bash scripts/check-env-placeholders.sh
        language: system
        pass_filenames: false
        stages: [commit]